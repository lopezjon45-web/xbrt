# Builds xbrt on windows-2022: the console package, the core tests, the desktop host and its run, the gates, and the
# packages as prerelease assets. The macOS job was dropped (10x minutes); core/ is built on the Mac by hand with
# scripts/build-mac.sh, which has no Windows SDK on its include path. windows-2022 is pinned:
# windows-latest moved to Visual Studio 18 on 2026-10-25 and broke the UWP build line that starts on the console.
# Packages are release assets, never workflow artifacts (the account's artifact quota was full the same night).
name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NXDK_COMMIT: a6c31ee90540710a3df26a0712b61492f2ea03dd
      EXTRACT_XISO_COMMIT: 3f5b62cfe68f000b0e3c8a30104973f3a297948e
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the lab judge
        run: python3 scripts/check-lab-run.py --self-test
      - name: Self-test the M0 report
        run: python3 scripts/m0-report.py --self-test
      - name: Fetch nxdk
        run: |
          git init -q nxdk
          git -C nxdk fetch -q --depth 1 https://github.com/XboxDev/nxdk.git "$NXDK_COMMIT"
          git -C nxdk checkout -q FETCH_HEAD
          git -C nxdk submodule update -q --init --depth 1 lib/pdclib
          # lab/pad is an nxdk program: nxdk's Makefile links every default library, and its USB stack is libusbohci.
          git -C nxdk submodule update -q --init --depth 1 lib/usb/libusbohci lib/net/lwip lib/zlib/zlib lib/libpng/libpng lib/libjpeg/libjpeg-turbo
      - name: Install LLVM 18
        run: sudo apt-get install -y -q --no-install-recommends clang-18 lld-18 llvm-18
      - name: Build the lab XBEs
        run: NXDK_DIR="$PWD/nxdk" LLVM_BIN=/usr/lib/llvm-18/bin bash lab/build.sh lab-xbe
      # Every lab also runs from an XISO of its folder, so D:\ read in place answers as the folder does.
      - name: Build an XISO of each lab
        run: |
          git init -q extract-xiso
          git -C extract-xiso fetch -q --depth 1 https://github.com/XboxDev/extract-xiso.git "$EXTRACT_XISO_COMMIT"
          git -C extract-xiso checkout -q FETCH_HEAD
          cc -O2 -w -D__LINUX__ -o extract-xiso/extract-xiso extract-xiso/extract-xiso.c
          mkdir -p lab-iso
          for d in lab-xbe/*/; do extract-xiso/extract-xiso -q -m -c "$d" "lab-iso/$(basename "$d").iso"; done
          ls -l lab-iso
      # An artifact, not a release asset: a branch run has no release, and the brief allows the public repo's
      # artifact storage for these few KB.
      - uses: actions/upload-artifact@v4
        with:
          name: lab-xbe
          path: lab-xbe
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lab-iso
          path: lab-iso
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: lab
    # A broken lab build must not cost the console package: the lab steps below skip when the XBEs are missing.
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check the bridge status table against the fork
        run: python scripts/gen-bridge-status.py external/xboxrecomp/src/kernel/kernel_bridge.c --check core/gen/bridge_status.inc
      - name: No disc or console data, no per-title code
        shell: bash
        run: scripts/check-no-disc-data.sh && scripts/check-no-title-code.sh
      # A branch may carry link-only placeholders for a workstream that has not landed; main may not.
      - name: No placeholder definitions on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -e host/cpu_pending.cpp ]; then echo "host/cpu_pending.cpp is on main; delete it for the real definitions"; exit 1; fi
      - name: Fetch the M0 corpus
        if: hashFiles('tools/m0/corpus.lock') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r tag sum < tools/m0/corpus.lock
          gh release download "$tag" --repo lopezjon45-web/xemu --pattern m0-corpus.tar.gz --dir m0-src
          echo "$sum  m0-src/m0-corpus.tar.gz" | sha256sum -c
          tar -xzf m0-src/m0-corpus.tar.gz -C m0-src
          mkdir -p gen
          python tools/m0/pack-corpus.py m0-src/corpus gen/m0-corpus.txt
      # No uwp: true: the probes that start on the console build in this plain x64 environment, so xbrt does too.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build, test, gate, pack and sign
        shell: powershell
        run: .\build.ps1
      - name: Run the desktop host
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force desktop-run | Out-Null
          Set-Location desktop-run
          ..\gen\xbrt_desktop.exe
          Write-Output "exit $LASTEXITCODE"
          Copy-Item run.txt ..\out\desktop-run.txt -ErrorAction SilentlyContinue
      - name: Judge the desktop run
        run: python scripts/check-desktop-run.py out/desktop-run.txt
      - name: Run the CPU core's tests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force cpu-tests | Out-Null
          Set-Location cpu-tests
          ..\gen\xbrt_desktop.exe --cpu-tests
          Write-Output "exit $LASTEXITCODE"
          Copy-Item cpu-tests.txt ..\out\cpu-tests.txt -ErrorAction SilentlyContinue
      - name: Judge the CPU tests
        run: python scripts/check-cpu-tests.py out/cpu-tests.txt
      - name: Run the kernel adapter tests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force kernel-tests | Out-Null
          Set-Location kernel-tests
          ..\gen\xbrt_desktop.exe --kernel-tests
          Write-Output "exit $LASTEXITCODE"
          Copy-Item kernel-tests.txt ..\out\kernel-tests.txt -ErrorAction SilentlyContinue
      - name: Judge the kernel adapter tests
        run: python scripts/check-kernel-tests.py out/kernel-tests.txt
      - name: Run the M0 probe on WARP
        if: hashFiles('tools/m0/corpus.lock') != ''
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force m0-warp | Out-Null
          Set-Location m0-warp
          $code = 2
          for ($i = 1; $i -le 40 -and $code -eq 2; $i++) {
            ..\gen\xbrt_desktop.exe --m0 ..\gen\m0-corpus.txt | Out-Null
            $code = $LASTEXITCODE
            Get-Content run.txt | Add-Content ..\out\m0-warp-run.txt
            Write-Output "launch $i exit $code"
          }
          Copy-Item m0.tsv ..\out\m0-warp.tsv
          Get-Content ..\out\m0-warp-run.txt
          if ($code -ne 0) { exit 1 }
      - name: Report the M0 probe on WARP
        if: hashFiles('tools/m0/corpus.lock') != ''
        shell: bash
        run: |
          python scripts/m0-report.py out/m0-warp.tsv --label "WARP on windows-2022, run ${{ github.run_id }}" | tee out/m0-warp-report.txt || true
          grep -q "^end" out/m0-warp.tsv
      - name: Fetch the lab XBEs
        id: labxbe
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lab-xbe
          path: lab-xbe
      - name: Fetch the lab XISOs
        id: labiso
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lab-iso
          path: lab-iso
      # Each lab boots from its folder, then from its XISO; a lab with expected-second.txt boots its folder again over
      # the first launch's saves. Saves go to <work>\home\saves\xbrt, as a hub link's home= puts them on the drive.
      - name: Run the lab XBEs
        if: steps.labxbe.outcome == 'success'
        shell: powershell
        run: |
          foreach ($d in "out\lab-run", "out\lab-iso", "out\lab-second") { New-Item -ItemType Directory -Force $d | Out-Null }
          function Run-Lab($work, $target, $log) {
            New-Item -ItemType Directory -Force $work | Out-Null
            Push-Location $work
            cmd /c "$root\gen\xbrt_desktop.exe --run $target --seconds 20 --home home > $log 2>&1"
            Write-Output "${target}: exit $LASTEXITCODE"
            Pop-Location
          }
          $root = (Get-Location).Path
          foreach ($lab in Get-ChildItem lab-xbe -Directory) {
            Run-Lab "lab-work\$($lab.Name)" "$root\lab-xbe\$($lab.Name)" "$root\out\lab-run\$($lab.Name).txt"
            if (Test-Path "lab\$($lab.Name)\expected-second.txt") {
              Run-Lab "lab-work\$($lab.Name)" "$root\lab-xbe\$($lab.Name)" "$root\out\lab-second\$($lab.Name).txt"
            }
          }
          if (Test-Path lab-iso) {
            foreach ($iso in Get-ChildItem lab-iso -Filter *.iso) {
              Run-Lab "lab-work-iso\$($iso.BaseName)" "$root\lab-iso\$($iso.Name)" "$root\out\lab-iso\$($iso.BaseName).txt"
            }
          }
          exit 0
      - name: Judge the lab runs
        if: steps.labxbe.outcome == 'success'
        run: python scripts/check-lab-run.py lab out/lab-run --known-failure seh
      - name: Judge the lab runs from XISOs
        if: steps.labxbe.outcome == 'success' && steps.labiso.outcome == 'success'
        run: python scripts/check-lab-run.py lab out/lab-iso --known-failure seh
      - name: Judge the second launches and where the saves landed
        if: steps.labxbe.outcome == 'success'
        run: |
          python scripts/check-lab-run.py lab out/lab-second --expected expected-second.txt
          python scripts/check-save-layout.py lab-work/save/home/saves/xbrt FFFF0002 2
      # The judges print only each failing run's last 200 lines; the whole runs are a few hundred KB.
      - uses: actions/upload-artifact@v4
        if: failure() && steps.labxbe.outcome == 'success'
        with:
          name: lab-runs
          path: out/lab-*
          retention-days: 3
      - name: Publish the packages as a prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" out/*.appx out/SHA256SUMS.txt out/gate.txt out/gate-guards.txt out/build-info.txt out/desktop-run.txt out/cpu-tests.txt out/xbrt.pdb out/xbrt-inspect.exe out/xbrt_desktop.exe $(ls out/m0-warp.tsv out/m0-warp-report.txt 2>/dev/null) \
            --prerelease --title "xbrt build ${{ github.run_number }} ($(git rev-parse --short HEAD))" \
            --notes "Run ${{ github.run_id }} of ${{ github.sha }}. Install LopezJon.XboxRuntime_*.appx; the XbrtBisect0..5 packages are the start-refusal ladder (package/make-manifests.py)."
